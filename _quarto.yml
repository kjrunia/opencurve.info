project:
  type: website
  output-dir: _site
  resources:
    # - CNAME
    - "**/*.mp3"
    - "**/*.m4a"

website:
  # title: ""
  description: "A bit of maths and physics for everyone"
  favicon: OpenCurveFavicon.png
  navbar:
    logo: logo-horizontal.png
    logo-alt: "OpenCurve: A bit of maths and physics for everyone"
    left:
      - href: index.qmd
        text: Articles
      - href: mathematics.qmd
        text: Mathematics
      - href: physics.qmd
        text: Physics
      - href: about.qmd
        text: About / Privacy Policy
    right:
      - icon: search
        aria-label: Search

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    html-math-method: mathjax
    grid: 
      body-width: 720px
      sidebar-width: 200px
      margin-width: 260px
    lightbox: true